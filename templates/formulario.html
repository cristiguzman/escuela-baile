<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Escuela de Baile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h1 { color: #667eea; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select { 
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; 
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .checkbox-group { margin-bottom: 15px; }
        input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
        .signature-area { border: 2px dashed #ddd; padding: 10px; border-radius: 5px; }
        canvas { border: 1px solid #ccc; width: 100%; background: white; cursor: crosshair; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #764ba2; }
        .message { text-align: center; margin-top: 10px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .hidden { display: none !important; }
        .section-title { font-weight: bold; color: #667eea; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid #667eea; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Inscripción Escuela de Baile</h1>
        
        <form id="formulario">
            <!-- DATOS DEL ALUMNO -->
            <div class="section-title">Datos del Alumno</div>
            
            <div class="form-group">
                <label for="edad">¿Es mayor de edad? (18+)</label>
                <select id="edad" required>
                    <option value="">Selecciona...</option>
                    <option value="mayor">Sí, soy mayor de 18</option>
                    <option value="menor">No, soy menor de 18</option>
                </select>
            </div>

            <div id="datos-alumno">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
            </div>

            <!-- DATOS DEL TUTOR (solo si es menor) -->
            <div id="datos-tutor" class="hidden">
                <div class="section-title">Datos del Tutor/Responsable</div>
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo del Alumno *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="tutor_nombre">Nombre Tutor/Responsable *</label>
                    <input type="text" id="tutor_nombre" name="tutor_nombre">
                </div>

                <div class="form-group">
                    <label for="tutor_email">Email Tutor *</label>
                    <input type="email" id="tutor_email" name="tutor_email">
                </div>

                <div class="form-group">
                    <label for="tutor_telefono">Teléfono Tutor *</label>
                    <input type="tel" id="tutor_telefono" name="tutor_telefono">
                </div>
            </div>

            <!-- CLASES -->
            <div class="section-title">Selecciona tus Clases</div>
            <div class="checkbox-group">
                <input type="checkbox" id="clase1" name="clases" value="Lunes 15:00 - Salsa Principiante">
                <label for="clase1">Lunes 15:00 - Salsa Principiante</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="clase2" name="clases" value="Martes 16:30 - Bachata Intermedio">
                <label for="clase2">Martes 16:30 - Bachata Intermedio</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="clase3" name="clases" value="Miércoles 17:00 - Reggaeton">
                <label for="clase3">Miércoles 17:00 - Reggaeton</label>
            </div>

            <!-- ACEPTACIONES -->
            <div class="section-title">Términos y Condiciones</div>
            <div class="checkbox-group">
                <input type="checkbox" id="acepta" name="acepta_terminos" required>
                <label for="acepta">Acepto los términos y condiciones *</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="autoriza" name="autoriza_imagen">
                <label for="autoriza">Autorizo el uso de imágenes en eventos</label>
            </div>

            <!-- FIRMA -->
            <div class="section-title">Firma Digital</div>
            <div class="signature-area">
                <p>Firma aquí:</p>
                <canvas id="canvas" width="500" height="150"></canvas>
                <button type="button" onclick="limpiarFirma()">Limpiar Firma</button>
            </div>

            <!-- ENVIAR -->
            <button type="submit">✓ Enviar Inscripción</button>
            <div id="mensaje" class="message" style="display:none;"></div>
        </form>
    </div>

    <script>
        // Canvas para firma
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        canvas.addEventListener('mousedown', () => dibujando = true);
        canvas.addEventListener('mouseup', () => dibujando = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!dibujando) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        function limpiarFirma() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Mostrar/ocultar secciones según edad
        document.getElementById('edad').addEventListener('change', function() {
            const datosAlumno = document.getElementById('datos-alumno');
            const datosTutor = document.getElementById('datos-tutor');
            
            if (this.value === 'mayor') {
                datosAlumno.classList.remove('hidden');
                datosTutor.classList.add('hidden');
                // Hacer requeridos los campos del alumno
                document.getElementById('nombre').required = true;
                document.getElementById('email').required = true;
                document.getElementById('telefono').required = true;
                document.getElementById('tutor_nombre').required = false;
                document.getElementById('tutor_email').required = false;
                document.getElementById('tutor_telefono').required = false;
            } else if (this.value === 'menor') {
                datosAlumno.classList.add('hidden');
                datosTutor.classList.remove('hidden');
                // Hacer requeridos los campos del tutor
                document.getElementById('nombre').required = true;
                document.getElementById('email').required = false;
                document.getElementById('telefono').required = false;
                document.getElementById('tutor_nombre').required = true;
                document.getElementById('tutor_email').required = true;
                document.getElementById('tutor_telefono').required = true;
            }
        });

        // Enviar formulario
        document.getElementById('formulario').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const edad = document.getElementById('edad').value;
            const clases = Array.from(document.querySelectorAll('input[name="clases"]:checked')).map(el => el.value);
            
            if (clases.length === 0) {
                mostrarMensaje('Selecciona al menos una clase', 'error');
                return;
            }

            const datos = {
                edad: edad,
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value || '',
                telefono: document.getElementById('telefono').value || '',
                tutor_nombre: document.getElementById('tutor_nombre').value || '',
                tutor_email: document.getElementById('tutor_email').value || '',
                tutor_telefono: document.getElementById('tutor_telefono').value || '',
                clases: clases,
                acepta_terminos: document.getElementById('acepta').checked,
                autoriza_imagen: document.getElementById('autoriza').checked,
                firma: canvas.toDataURL('image/png')
            };

            try {
                const response = await fetch('/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await response.json();
                
                if (resultado.success) {
                    mostrarMensaje('✓ ' + resultado.mensaje, 'success');
                    document.getElementById('formulario').reset();
                    limpiarFirma();
                } else {
                    mostrarMensaje('✗ Error: ' + resultado.error, 'error');
                }
            } catch (error) {
                mostrarMensaje('✗ Error de conexión', 'error');
            }
        });

        function mostrarMensaje(texto, tipo) {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = texto;
            mensaje.className = 'message ' + tipo;
            mensaje.style.display = 'block';
            setTimeout(() => mensaje.style.display = 'none', 5000);
        }
    </script>
</body>
</html>
