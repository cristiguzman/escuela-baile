<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Inscripción completada | Bailando Soñarás</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .confirmation-card {
            width: 100%;
            max-width: 550px;
            padding: 45px 30px;
            text-align: center;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .check {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 50px;
            background-color: #28a745;
            border-radius: 50%;
        }

        h1 {
            margin: 0 0 20px;
            color: #333333;
            font-size: 30px;
        }

        p {
            margin: 10px 0;
            color: #666666;
            font-size: 17px;
            line-height: 1.6;
        }

        .email-message {
            margin-top: 25px;
            padding: 15px;
            color: #444444;
            background-color: #f5f5f5;
            border-radius: 10px;
        }

        .button {
            margin-top: 30px;
            padding: 14px 25px;
            display: inline-block;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            background-color: #667eea;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: #5568d8;
        }
    </style>
</head>

<body>
    <main class="confirmation-card">
        <div class="check" aria-hidden="true">✓</div>

        <h1>¡Inscripción completada!</h1>

        <p>
            Tus datos se han registrado correctamente.
        </p>

        <p>
            En breve nos pondremos en contacto contigo para
            proporcionarte más información.
        </p>

        <div class="email-message">
            Revisa tu correo electrónico y la carpeta de correo no
            deseado para encontrar la confirmación.
        </div>

        <a class="button" href="/">
            Volver al formulario
        </a>
    </main>
</body>
</html>
